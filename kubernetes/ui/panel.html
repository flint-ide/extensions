<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kubernetes</title>
  <style>
    /* Flint's theme arrives as CSS variables on :root (flint.theme); the fallbacks only matter outside Flint. */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; overflow: hidden;
      font: 13px var(--font-ui, system-ui, sans-serif); color: var(--fg, #ccc); background: var(--bg-sidebar, #1e1e1e);
      user-select: none; -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    input { font: inherit; color: var(--fg, #ccc); background: var(--bg-editor, #181818); border: 1px solid var(--border, #333); border-radius: 5px; padding: 3px 8px; outline: none; min-width: 0; }
    input:focus { border-color: var(--accent, #4a9eff); }
    .muted { color: var(--fg-muted, #999); }

    .header { height: 32px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted, #999); }
    .header .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.icon { background: none; border: none; padding: 2px 6px; color: var(--fg-muted, #999); font-size: 12px; border-radius: 4px; display: inline-flex; align-items: center; }
    button.icon:hover:not(:disabled) { color: var(--fg, #ccc); background: var(--bg-hover, #2a2a2a); }
    button.link { padding: 0; border: none; background: none; color: var(--accent, #4a9eff); font-size: 11px; }
    button.link:hover { text-decoration: underline; }

    .pickers { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 8px; flex: none; }
    .row { display: flex; align-items: center; gap: 4px; }
    .select { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; text-align: left; background: var(--bg-editor, #181818); border: 1px solid var(--border, #333); border-radius: 5px; padding: 3px 8px; height: 24px; }
    .select:focus-visible, .select.open { border-color: var(--accent, #4a9eff); outline: none; }
    .select .lbl { color: var(--fg-faint, #777); font-size: 11px; flex: none; }
    .select .val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .select .val.placeholder { color: var(--fg-faint, #777); }
    .select .chev { color: var(--fg-faint, #777); font-size: 10px; flex: none; }
    .ns-input { flex: 1; font-family: var(--font-mono, monospace); font-size: 12px; height: 24px; }
    .aws { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .segmented { display: inline-flex; flex: none; border: 1px solid var(--border, #333); border-radius: 6px; overflow: hidden; }
    .segmented button { border: none; border-radius: 0; background: var(--bg-raised, #252525); padding: 2px 10px; font-size: 12px; }
    .segmented button + button { border-left: 1px solid var(--border, #333); }
    .segmented button.on { background: var(--accent, #4a9eff); color: var(--accent-fg, #fff); font-weight: 600; }
    .filter { flex: 1; height: 24px; }
    .partial { font-size: 11px; }

    .tree { flex: 1; overflow: auto; min-height: 0; padding-bottom: 8px; }
    .tree-row { position: relative; height: 22px; display: flex; align-items: center; gap: 4px; padding: 0 8px; white-space: nowrap; cursor: pointer; }
    .tree-row:hover { background: var(--bg-hover, #2a2a2a); }
    .twisty { width: 12px; flex: none; color: var(--fg-faint, #777); font-size: 10px; text-align: center; }
    .name { overflow: hidden; text-overflow: ellipsis; color: var(--fg-name, var(--fg, #ccc)); }
    .hint { font-size: 11px; color: var(--fg-muted, #999); overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .badge { font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--bg-active, #333); color: var(--fg-muted, #999); margin-left: auto; }
    .section .name { font-weight: 600; flex: 1; }
    .item { padding-left: 22px; }
    .pod { padding-left: 40px; }
    .kind { flex: none; min-width: 22px; font-size: 9px; font-weight: 700; color: var(--info, #4aa3df); }
    .dot { flex: none; font-size: 9px; }
    .dot.ok { color: var(--ok, #4caf50); } .dot.warn { color: var(--warn, #e0a030); } .dot.bad { color: var(--danger, #e05050); } .dot.muted { color: var(--fg-muted, #999); }
    .status { flex: none; font-size: 11px; padding: 0 6px; border-radius: 8px; font-variant-numeric: tabular-nums; }
    .status.ok { color: var(--ok, #4caf50); background: color-mix(in srgb, var(--ok, #4caf50) 14%, transparent); }
    .status.warn { color: var(--warn, #e0a030); background: color-mix(in srgb, var(--warn, #e0a030) 14%, transparent); }
    .status.bad { color: var(--danger, #e05050); background: color-mix(in srgb, var(--danger, #e05050) 14%, transparent); }
    .status.muted { color: var(--fg-muted, #999); }
    .app-row .name { font-weight: 600; }
    .source { flex: none; font-size: 10px; padding: 0 5px; border-radius: 6px; color: var(--accent, #4a9eff); background: color-mix(in srgb, var(--accent, #4a9eff) 14%, transparent); }
    .ai { flex: none; font-size: 10px; padding: 0 6px; border-radius: 6px; color: var(--accent, #4a9eff); background: none; border: none; }
    .ai:hover:not(:disabled) { background: var(--bg-hover, #2a2a2a); }
    .app-body { padding-bottom: 4px; }
    .problem { padding: 1px 10px 2px 30px; font-size: 11px; line-height: 1.35; word-break: break-word; white-space: normal; }
    .problem.bad { color: var(--danger, #e05050); } .problem.warn { color: var(--warn, #e0a030); }
    .pod-problem { padding-left: 56px; }
    .more { margin-left: 30px; }
    .placeholder { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text; }
    .placeholder.error { color: var(--danger, #e05050); }

    /* Pop-ups: context menus, pickers and the confirm dialog. */
    .menu, .picker { position: fixed; z-index: 10; background: var(--bg-raised, #252525); border: 1px solid var(--border, #333); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.35); padding: 4px 0; font-size: 12px; }
    .menu { min-width: 170px; max-width: calc(100vw - 8px); }
    .menu .mi { display: flex; align-items: center; gap: 16px; height: 24px; padding: 0 12px; cursor: pointer; white-space: nowrap; }
    .menu .mi:hover, .menu .mi.on { background: var(--accent, #4a9eff); color: var(--accent-fg, #fff); }
    .menu .mi.danger { color: var(--danger, #e05050); }
    .menu .mi.danger:hover, .menu .mi.danger.on { background: var(--danger, #e05050); color: #fff; }
    .menu .mi .mh { margin-left: auto; font-size: 11px; opacity: 0.7; }
    .menu .sep { height: 1px; margin: 4px 0; background: var(--border, #333); }
    .picker { display: flex; flex-direction: column; padding: 4px; }
    .picker input { margin-bottom: 4px; height: 24px; }
    .picker .opts { overflow: auto; max-height: 260px; }
    .picker .opt { display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .picker .opt .ol { overflow: hidden; text-overflow: ellipsis; }
    .picker .opt .oh { margin-left: auto; font-size: 11px; color: var(--fg-muted, #999); flex: none; }
    .picker .opt.on { background: var(--accent, #4a9eff); color: var(--accent-fg, #fff); }
    .picker .opt.on .oh { color: inherit; opacity: 0.8; }
    .picker .opt.cur .ol { font-weight: 600; }
    .picker .none { padding: 4px 8px; color: var(--fg-faint, #777); }
    .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .dialog { background: var(--bg-raised, #252525); border: 1px solid var(--border, #333); border-radius: 8px; padding: 14px; max-width: 360px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .dialog p { margin: 0 0 12px; line-height: 1.4; word-break: break-word; user-select: text; -webkit-user-select: text; }
    .dialog .buttons { display: flex; justify-content: flex-end; gap: 6px; }
    .dialog button { border: 1px solid var(--border, #333); background: var(--bg-editor, #181818); border-radius: 5px; padding: 3px 12px; }
    .dialog button.primary { background: var(--accent, #4a9eff); border-color: var(--accent, #4a9eff); color: var(--accent-fg, #fff); }
    .dialog button.primary.danger { background: var(--danger, #e05050); border-color: var(--danger, #e05050); color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Kubernetes</span>
    <button class="icon" id="term" title="Terminal in this context and namespace">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4.5 6l2 2-2 2M8 10.5h3.5"/></svg>
    </button>
    <button class="icon" id="refresh" title="Refresh">↻</button>
  </div>
  <div class="pickers">
    <div class="row"><button class="select" id="ctx"></button></div>
    <div class="row"><span id="nsWrap" class="row" style="flex:1;min-width:0"></span><button class="icon" id="star" title="Make this the kubeconfig's current context (all terminals and tools)" hidden>★</button></div>
    <div class="aws" id="aws" hidden></div>
    <div class="row">
      <div class="segmented" role="radiogroup" aria-label="View">
        <button role="radio" data-view="apps">Apps</button><button role="radio" data-view="resources">Resources</button>
      </div>
      <input class="filter" id="filter" placeholder="Filter" spellcheck="false">
    </div>
    <div class="muted partial" id="partial" hidden></div>
  </div>
  <div class="tree" id="tree"></div>
  <script>
  'use strict'
  // ---------- pure helpers (Flint's frontend/src/features/kubernetes/kube.ts and lib/aws.ts) ----------

  /** A readable context name: EKS ARNs become "cluster (account)", GKE names "cluster (project)". */
  function shortContext(name) {
    const eks = /^arn:aws:eks:[^:]+:(\d+):cluster\/(.+)$/.exec(name)
    if (eks) return `${eks[2]} (${eks[1]})`
    const gke = /^gke_([^_]+)_[^_]+_(.+)$/.exec(name)
    if (gke) return `${gke[2]} (${gke[1]})`
    return name
  }
  /** "40s", "12m", "3h", "5d" since an RFC 3339 time. */
  function age(created, now) {
    const t = Date.parse(created)
    if (Number.isNaN(t)) return ''
    const s = Math.max(0, Math.round((now - t) / 1000))
    if (s < 60) return `${s}s`
    if (s < 3600) return `${Math.floor(s / 60)}m`
    if (s < 86400) return `${Math.floor(s / 3600)}h`
    return `${Math.floor(s / 86400)}d`
  }
  const resourceRef = (kind, name) => `${kind.toLowerCase()}/${name}`
  function podTone(p) {
    if (p.healthy) return 'ok'
    if (/BackOff|Err|Error|Failed|OOMKilled|Evicted|Invalid/i.test(p.status)) return 'bad'
    if (p.status === 'Completed' || p.status === 'Succeeded') return 'muted'
    return 'warn'
  }
  function workloadTone(w) {
    if (w.desired === 0) return 'muted'
    if (w.ready >= w.desired) return 'ok'
    return w.ready === 0 ? 'bad' : 'warn'
  }
  /** Kubectl failures that mean the cluster login (e.g. AWS) expired. */
  const isAuthError = (m) => /expired|ExpiredToken|InvalidClientTokenId|Unauthorized|You must be logged in|get-token|credentials|SSO session/i.test(m)
  function matches(query, ...fields) {
    const q = query.trim().toLowerCase()
    return !q || fields.some((f) => f && f.toLowerCase().includes(q))
  }
  function rolloutBadge(w) {
    const rev = w.revision ? `rev ${w.revision}` : ''
    switch (w.rollout) {
      case 'complete': return { text: rev ? `${rev} ✓` : '✓', tone: 'ok', title: 'Rolled out' }
      case 'progressing': return { text: 'rolling out', tone: 'warn', title: w.rolloutMessage || 'Rollout in progress' }
      case 'failed': return { text: 'failed', tone: 'bad', title: w.rolloutMessage || 'Rollout failed' }
      case 'paused': return { text: 'paused', tone: 'warn', title: 'Rollout paused' }
      case 'scaled-down': return { text: 'scaled to 0', tone: 'muted', title: 'No replicas' }
    }
    return { text: w.rollout || '', tone: 'muted', title: '' }
  }
  const healthTone = (h) => (h === 'ok' ? 'ok' : h === 'bad' ? 'bad' : 'warn')
  const SOURCE_LABELS = { flux: 'Flux', argo: 'Argo CD', helm: 'Helm', label: 'label', workload: '' }
  const appSourceLabel = (s) => (s in SOURCE_LABELS ? SOURCE_LABELS[s] : s)
  function shortRevision(r) {
    const m = /^(?:(.+)@)?(?:sha1|sha256):([0-9a-f]{7})[0-9a-f]*$/.exec(r)
    return m ? (m[1] ? `${m[1]}@${m[2]}` : m[2]) : r
  }
  const SOON_MS = 15 * 60000
  function timeLeft(ms) {
    const s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return `${s}s`
    const m = Math.floor(s / 60)
    if (m < 60) return `${m}m`
    const h = Math.floor(m / 60)
    if (h < 48) return `${h}h ${String(m % 60).padStart(2, '0')}m`
    return `${Math.floor(h / 24)}d`
  }
  function profileStatus(p, now) {
    const expires = p.expiresAt ? Date.parse(p.expiresAt) : NaN
    if (!Number.isNaN(expires)) {
      const left = expires - now
      const at = new Date(expires).toLocaleString()
      if (left <= 0) return { text: 'expired', tone: 'bad', title: `Expired ${at}` }
      return { text: timeLeft(left), tone: left < SOON_MS ? 'warn' : 'ok', title: `Valid until ${at}` }
    }
    switch (p.status) {
      case 'logged-out': return { text: 'logged out', tone: 'bad', title: 'No cached login: log in first' }
      case 'static': return { text: 'keys', tone: 'muted', title: 'Long-term access keys (no expiry)' }
      default: return { text: '—', tone: 'muted', title: p.source ? `Uses the credentials of ${p.source}` : 'Checked when used' }
    }
  }
  const MAX_PROBLEMS = 6
  const AWS_EVERY_MS = 30000

  // ---------- DOM helper ----------

  /** h('div', { class, title, onclick, … }, ...children): children may be strings, nodes, arrays, null or false. */
  function h(tag, props, ...children) {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
      else if (k === 'class') el.className = v
      else el.setAttribute(k, v === true ? '' : String(v))
    }
    const add = (c) => {
      if (c == null || c === false) return
      if (Array.isArray(c)) c.forEach(add)
      else el.append(c instanceof Node ? c : String(c))
    }
    children.forEach(add)
    return el
  }
  const $ = (id) => document.getElementById(id)
  const errorText = (err) => String((err && err.message) || err).slice(0, 2000)

  // ---------- talking to the process ----------

  const hasFlint = typeof window.flint === 'object' && window.flint !== null
  const req = (method, params) => (hasFlint ? flint.request(method, params) : Promise.reject(new Error('Open this panel in Flint.')))
  function toast(text, type) {
    if (hasFlint) flint.showMessage(type || 'info', String(text).slice(0, 1000))
  }

  // ---------- state (Flint's store.ts) ----------

  const S = {
    contexts: [], contextsError: null, context: '', namespaces: [], namespace: '', overview: null,
    loading: false, error: null, query: '', busy: new Set(), view: 'apps',
    closed: new Set(), chosen: {}, moreProblems: new Set(), now: Date.now(),
    aws: null, awsRefreshing: new Set(), awsNeedsInput: new Set(), awsReadAt: 0,
    saved: { context: '', namespaces: {}, view: 'apps' }, refreshSeconds: 5, visible: true,
  }
  const set = (patch) => (Object.assign(S, patch), render())
  const saveState = (patch) => {
    S.saved = { ...S.saved, ...patch }
    req('saveState', { state: S.saved }).catch(() => {}) // not remembered: nothing breaks
  }
  const selectedContext = () => S.contexts.find((c) => c.name === S.context)
  const scope = () => ({ context: S.context, namespace: S.namespace })

  /** Reads the kubeconfig; keeps the chosen context when it still exists, else the current one. */
  async function loadContexts() {
    try {
      const contexts = (await req('contexts')) || []
      const keep = contexts.some((c) => c.name === S.context) ? S.context : ((contexts.find((c) => c.current) || contexts[0] || {}).name || '')
      set({ contexts, contextsError: null })
      if (keep !== S.context || !S.namespace) await selectContext(keep)
      else void loadAws()
    } catch (err) {
      set({ contextsError: errorText(err), contexts: [] })
    }
  }

  /** Shows another context (the kubeconfig's current context is left alone). */
  async function selectContext(name) {
    const ctx = S.contexts.find((c) => c.name === name)
    const namespace = S.saved.namespaces[name] || (ctx && ctx.namespace) || 'default'
    set({ context: name, namespace, namespaces: [], overview: null, error: null, aws: null })
    saveState({ context: name })
    if (!name) return
    void refreshOverview()
    void loadAws()
    try {
      const namespaces = (await req('namespaces', { context: name })) || []
      if (S.context === name) set({ namespaces })
    } catch {
      // listing namespaces may be forbidden: the context's own namespace still works
    }
  }

  function selectNamespace(namespace) {
    saveState({ namespaces: { ...S.saved.namespaces, [S.context]: namespace } })
    set({ namespace, overview: null, error: null })
    void refreshOverview()
  }

  let inFlight = null
  /** Re-reads the shown namespace; an answer for a context or namespace switched away from is dropped. */
  function refreshOverview() {
    if (inFlight) return inFlight
    inFlight = (async () => {
      const { context, namespace } = S
      if (!context) return
      set({ loading: true })
      try {
        const overview = await req('overview', { context, namespace })
        if (S.context === context && S.namespace === namespace) {
          S.overview = overview
          S.error = null
        }
      } catch (err) {
        if (S.context === context && S.namespace === namespace) S.error = errorText(err)
      } finally {
        inFlight = null
        set({ loading: false })
      }
    })()
    return inFlight
  }

  /** The AWS profile of an EKS context (its credential status), re-read now and then. */
  async function loadAws() {
    const ctx = selectedContext()
    const profile = ctx && ctx.awsProfile
    S.awsReadAt = Date.now()
    if (!profile) return set({ aws: null })
    try {
      const aws = await req('awsProfile', { profile })
      const now = selectedContext()
      if (now && now.awsProfile === profile) set({ aws: aws || null })
    } catch {
      set({ aws: null })
    }
  }

  const busyOn = (key) => set({ busy: new Set(S.busy).add(key) })
  const busyOff = (key) => {
    const busy = new Set(S.busy)
    busy.delete(key)
    set({ busy })
  }

  async function act(key, method, params, done) {
    busyOn(key)
    try {
      await req(method, params)
      toast(done)
    } catch (err) {
      toast(errorText(err), 'error')
    } finally {
      busyOff(key)
      void refreshOverview()
    }
  }

  async function restartWorkload(w) {
    const s = scope()
    if (!(await confirmAction(`Restart all pods of ${w.kind} ${w.name} in ${shortContext(s.context)}?`, 'Restart'))) return
    await act(`${w.kind}/${w.name}`, 'restart', { ...s, kind: w.kind, name: w.name }, `Restarting ${w.name}`)
  }
  async function scaleWorkload(w, replicas) {
    const s = scope()
    if (replicas === 0 && !(await confirmAction(`Scale ${w.name} to 0? All its pods stop.`, 'Scale to 0', true))) return
    await act(`${w.kind}/${w.name}`, 'scale', { ...s, kind: w.kind, name: w.name, replicas }, `${w.name} scaled to ${replicas}`)
  }
  async function deletePod(p) {
    const s = scope()
    if (!(await confirmAction(`Delete pod ${p.name}?${p.owner ? ` ${p.owner} starts a new one.` : ''}`, 'Delete', true))) return
    await act(`Pod/${p.name}`, 'deletePod', { ...s, name: p.name }, `Deleting ${p.name}`)
  }
  async function undoRollout(w) {
    const s = scope()
    const from = w.revision ? ` from revision ${w.revision}` : ''
    if (!(await confirmAction(`Roll ${w.kind} ${w.name} back${from} to the previous revision in ${shortContext(s.context)}?`, 'Undo Rollout', true))) return
    await act(`${w.kind}/${w.name}`, 'undo', { ...s, kind: w.kind, name: w.name }, `Rolling back ${w.name}`)
  }

  /** Terminal tabs: the process builds and checks the kubectl argv and opens the tab. */
  const terminal = (method, params) => req(method, { ...scope(), ...params }).catch((err) => toast(errorText(err), 'error'))
  const openLogs = (target) => terminal('logs', { target })
  const openShell = (p, container) => terminal('exec', { pod: p.name, container: container || '' })
  const describe = (kind, name) => terminal('describe', { kind, name })
  const portForward = (target, port) => terminal('portForward', { target, port })
  const openRolloutStatus = (w) => terminal('rolloutStatus', { kind: w.kind, name: w.name })
  const openRolloutHistory = (w) => terminal('rolloutHistory', { kind: w.kind, name: w.name })
  const reconcileFlux = (k) => req('reconcile', { context: S.context, name: k.name, namespace: k.namespace }).catch((err) => toast(errorText(err), 'error'))
  const openContextTerminal = () => terminal('shell', {})

  /** Makes the shown context the kubeconfig's current one (for every terminal and tool). */
  async function useAsCurrent() {
    const { context } = S
    try {
      await req('useContext', { context })
      toast(`Current context: ${shortContext(context)}`)
      await loadContexts()
    } catch (err) {
      toast(errorText(err), 'error')
    }
  }

  /** Gathers the app's state and failing pods' logs (redacted by the process) into the agent chat's draft. */
  async function diagnoseWithAI(app) {
    const key = `app:${app.key}`
    busyOn(key)
    try {
      await req('diagnose', { ...scope(), app: app.key, name: app.name })
      toast('Diagnosis ready in the agent chat — review it and press Enter to send')
    } catch (err) {
      toast(errorText(err), 'error')
    } finally {
      busyOff(key)
    }
  }

  function awsLogin(p) {
    req('awsLogin', { profile: p.name }).catch((err) => toast(errorText(err), 'error'))
  }
  async function awsRefresh(p) {
    if (S.awsRefreshing.has(p.name)) return
    S.awsNeedsInput.delete(p.name)
    set({ awsRefreshing: new Set(S.awsRefreshing).add(p.name) })
    try {
      await req('awsRefresh', { profile: p.name }) // ends with a { type: 'aws' } message
    } catch (err) {
      const r = new Set(S.awsRefreshing)
      r.delete(p.name)
      set({ awsRefreshing: r })
      toast(errorText(err), 'error')
    }
  }
  function onAwsDone(m) {
    const r = new Set(S.awsRefreshing)
    r.delete(m.profile)
    S.awsRefreshing = r
    if (m.ok) {
      toast(`Refreshed ${m.profile}`)
      void refreshOverview()
    } else {
      if (m.needsInput) S.awsNeedsInput.add(m.profile)
      toast(m.error || `Refreshing ${m.profile} failed`, 'error')
    }
    void loadAws()
  }

  // ---------- pop-ups ----------

  let popup = null
  function closePopup() {
    if (!popup) return
    const p = popup
    popup = null
    p.el.remove()
    if (p.onClose) p.onClose()
  }
  function place(el, x, y) {
    document.body.append(el)
    const r = el.getBoundingClientRect()
    el.style.left = `${Math.max(4, Math.min(x, window.innerWidth - r.width - 4))}px`
    el.style.top = `${y + r.height > window.innerHeight - 4 ? Math.max(4, window.innerHeight - r.height - 4) : y}px`
  }

  /** A context menu at x, y: items are { label, hint?, danger?, onSelect } or 'sep'. */
  function openMenu(x, y, items) {
    closePopup()
    const rows = []
    const el = h('div', { class: 'menu', role: 'menu' }, items.map((it) => {
      if (it === 'sep') return h('div', { class: 'sep' })
      const row = h('div', { class: `mi${it.danger ? ' danger' : ''}`, role: 'menuitem', onclick: () => (closePopup(), it.onSelect()) },
        h('span', {}, it.label), it.hint ? h('span', { class: 'mh' }, it.hint) : null)
      row.onSelect = it.onSelect
      rows.push(row)
      return row
    }))
    popup = { el, kind: 'menu', rows, at: -1 }
    place(el, x, y)
  }
  const menu = (items) => (e) => {
    e.preventDefault()
    e.stopPropagation()
    openMenu(e.clientX, e.clientY, items.filter(Boolean))
  }

  /** A searchable list under anchor: options are { value, label, hint? }. */
  function openPicker(anchor, options, current, onChange) {
    closePopup()
    const r = anchor.getBoundingClientRect()
    const input = h('input', { placeholder: 'Search', spellcheck: 'false' })
    const list = h('div', { class: 'opts', role: 'listbox' })
    const el = h('div', { class: 'picker' }, input, list)
    el.style.width = `${Math.max(r.width, 180)}px`
    let shown = []
    let at = 0
    const draw = () => {
      shown = options.filter((o) => matches(input.value, o.label, o.value, o.hint))
      at = Math.max(0, Math.min(at, shown.length - 1))
      list.replaceChildren(...(shown.length ? shown.map((o, i) =>
        h('div', { class: `opt${i === at ? ' on' : ''}${o.value === current ? ' cur' : ''}`, role: 'option', title: o.value, onmousemove: () => { if (at !== i) { at = i; draw() } }, onclick: () => choose(o) },
          h('span', { class: 'ol' }, o.label), o.hint ? h('span', { class: 'oh' }, o.hint) : null)) : [h('div', { class: 'none' }, 'No matches')]))
      const on = list.querySelector('.on')
      if (on) on.scrollIntoView({ block: 'nearest' })
    }
    const choose = (o) => {
      closePopup()
      if (o.value !== current) onChange(o.value)
    }
    input.addEventListener('input', () => { at = 0; draw() })
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') at = Math.min(at + 1, shown.length - 1)
      else if (e.key === 'ArrowUp') at = Math.max(at - 1, 0)
      else if (e.key === 'Enter') { if (shown[at]) choose(shown[at]); e.preventDefault(); return }
      else if (e.key === 'Escape') { e.preventDefault(); closePopup(); anchor.focus(); return }
      else return
      e.preventDefault()
      draw()
    })
    at = Math.max(0, options.findIndex((o) => o.value === current))
    anchor.classList.add('open')
    popup = { el, kind: 'picker', onClose: () => anchor.classList.remove('open') }
    draw()
    place(el, r.left, r.bottom + 2)
    input.focus()
  }

  /** The panel's own confirm dialog: resolves true when the user confirms. */
  function confirmAction(message, label, danger) {
    closePopup()
    return new Promise((resolve) => {
      const done = (ok) => { scrim.remove(); document.removeEventListener('keydown', onKey, true); resolve(ok) }
      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false) }
        else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(true) }
      }
      const ok = h('button', { class: `primary${danger ? ' danger' : ''}`, onclick: () => done(true) }, label)
      const scrim = h('div', { class: 'scrim', onmousedown: (e) => { if (e.target === scrim) done(false) } },
        h('div', { class: 'dialog', role: 'alertdialog' }, h('p', {}, message),
          h('div', { class: 'buttons' }, h('button', { onclick: () => done(false) }, 'Cancel'), ok)))
      document.body.append(scrim)
      document.addEventListener('keydown', onKey, true)
      ok.focus()
    })
  }

  document.addEventListener('mousedown', (e) => { if (popup && !popup.el.contains(e.target)) closePopup() }, true)
  document.addEventListener('contextmenu', (e) => { if (!e.defaultPrevented && !(e.target instanceof HTMLInputElement)) e.preventDefault() })
  window.addEventListener('blur', closePopup)
  window.addEventListener('resize', closePopup)
  $('tree').addEventListener('scroll', closePopup)
  document.addEventListener('keydown', (e) => {
    if (!popup || popup.kind !== 'menu') return
    const { rows } = popup
    if (e.key === 'Escape') { e.preventDefault(); closePopup() }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault()
      popup.at = (popup.at + (e.key === 'ArrowDown' ? 1 : rows.length - 1)) % rows.length
      rows.forEach((r, i) => r.classList.toggle('on', i === popup.at))
    } else if (e.key === 'Enter' && rows[popup.at]) {
      e.preventDefault()
      const fn = rows[popup.at].onSelect
      closePopup()
      fn()
    }
  })

  // ---------- rendering ----------

  const flip = (set, key) => (set.has(key) ? set.delete(key) : set.add(key), render())
  const row = (props, ...children) => h('div', { ...props, class: `tree-row ${props.class || ''}` }, ...children)

  function renderTop() {
    const ctx = selectedContext()
    const ctxBtn = $('ctx')
    ctxBtn.replaceChildren(

    ctxBtn.title = S.context

  function renderResources(ov) {

  function renderApps(ov) {
    const q = S.query
    const apps = (ov.apps || []).filter((a) => matches(q, a.name, ...(a.workloads || []), ...(a.services || []), ...(a.ingresses || [])))
    if (apps.length === 0) return [h('div', { class: 'placeholder muted' }, q ? 'Nothing matches.' : 'No workloads in this namespace.')]
    const workloads = new Map((ov.workloads || []).map((w) => [`${w.kind}/${w.name}`, w]))
    const services = new Map((ov.services || []).map((s) => [s.name, s]))
    const ingresses = new Map((ov.ingresses || []).map((i) => [i.name, i]))
    const pods = new Map()
    for (const p of ov.pods || []) if (p.owner) pods.set(p.owner, [...(pods.get(p.owner) || []), p])

    return apps.map((a) => {
      const open = a.key in S.chosen ? S.chosen[a.key] : a.health !== 'ok'
      const problemsAll = a.problems || []
      // A pod's own problem is shown under the pod; the summary keeps the rest.
      const shownPods = (a.workloads || []).flatMap((ref) => pods.get(ref.slice(ref.indexOf('/') + 1)) || []).filter((p) => p.problem)
      const listed = problemsAll.map((text, i) => ({ text, critical: i < a.critical }))
        .filter((p) => !shownPods.some((pod) => p.text.startsWith(`${pod.name}: `) || p.text.startsWith(`Pod ${pod.name}: `)))
      const problems = S.moreProblems.has(a.key) ? listed : listed.slice(0, MAX_PROBLEMS)
      const k = a.kustomization
      const aiBusy = S.busy.has(`app:${a.key}`)
      const header = row({ class: 'app-row', onclick: () => { S.chosen[a.key] = !open; render() }, title: problemsAll.join('\n') || 'Healthy' },

      if (!open) return h('div', {}, header)
      const body = []

        body.push(row({ class: 'item', title: `${k.namespace}/${k.name}\n${k.message || ''}`, oncontextmenu: menu([

        for (const p of pods.get(w.name) || []) {

            h('span', { class: `dot ${podTone(p)}` }, '●'), h('span', { class: 'name' }, p.name),
            h('span', { class: 'hint' }, [p.old && 'old revision', p.restarts ? `↺${p.restarts}` : ''].filter(Boolean).join(' · ')),
            h('span', { class: `status ${podTone(p)}` }, S.busy.has(`Pod/${p.name}`) ? '…' : p.status === 'Running' ? `${p.ready}/${p.total}` : p.status)))
          if (p.problem) body.push(h('div', { class: 'problem bad pod-problem' }, p.problem))
        }
      }
      return h('div', {}, header, h('div', { class: 'app-body' }, body))
    })
  }

  function renderTree() {
    const out = []
    if (!hasFlint) out.push(h('div', { class: 'placeholder muted' }, 'Open this panel in Flint.'))
    if (S.contextsError) out.push(h('div', { class: 'placeholder error' }, S.contextsError))
    if (S.error) {
      const aws = S.aws
      const fix = aws && isAuthError(S.error) && (aws.refreshable || (aws.login && aws.login.length))
      out.push(h('div', { class: 'placeholder error' }, S.error,
        fix ? h('button', { class: 'link', onclick: () => (aws.refreshable && !S.awsNeedsInput.has(aws.name) ? void awsRefresh(aws) : awsLogin(aws)) },
          S.awsRefreshing.has(aws.name) ? `Refreshing AWS credentials (${aws.name})…` : `Refresh AWS credentials (${aws.name})`) : null))
    }
    if (!S.overview && !S.error && S.context) out.push(h('div', { class: 'placeholder muted' }, S.loading ? 'Loading…' : ''))
    if (!S.contextsError && hasFlint && S.contexts.length === 0 && !S.context && !S.loading) out.push(h('div', { class: 'placeholder muted' }, 'No contexts in the kubeconfig.'))
    if (S.overview && S.view === 'apps') out.push(...renderApps(S.overview))
    if (S.overview && S.view === 'resources') out.push(...renderResources(S.overview))
    $('tree').replaceChildren(...out.filter(Boolean))
  }

  let queued = false
  function render() {
    if (queued) return
    queued = true
    requestAnimationFrame(() => {
      queued = false
      renderTop()
      renderTree()
    })
  }

  // ---------- controls ----------

  $('ctx').addEventListener('click', (e) => openPicker(e.currentTarget, S.contexts.map((c) => ({
    value: c.name, label: shortContext(c.name), hint: [c.current && 'current', c.awsProfile && `aws:${c.awsProfile}`].filter(Boolean).join(' · ') || undefined,
  })), S.context, (name) => void selectContext(name)))
  $('star').addEventListener('click', () => void useAsCurrent())
  $('term').addEventListener('click', () => void openContextTerminal())
  $('refresh').addEventListener('click', () => {
    S.now = Date.now()
    void loadContexts()
    void refreshOverview()
  })
  $('filter').addEventListener('input', (e) => set({ query: e.target.value }))
  $('filter').addEventListener('keydown', (e) => { if (e.key === 'Escape' && e.target.value) { e.preventDefault(); e.target.value = ''; set({ query: '' }) } })
  for (const b of document.querySelectorAll('.segmented button')) {
    b.addEventListener('click', () => {
      set({ view: b.dataset.view })
      saveState({ view: b.dataset.view })
    })
  }

  // ---------- refresh while visible ----------

  const shown = () => S.visible && document.visibilityState === 'visible'
  function tick() {
    if (!shown()) return
    S.now = Date.now()
    if (Date.now() - S.awsReadAt >= AWS_EVERY_MS) void loadAws()
    void refreshOverview()
  }
  let timer = null
  function startTimer() {
    clearInterval(timer)
    timer = setInterval(tick, S.refreshSeconds * 1000)
  }
  document.addEventListener('visibilitychange', () => { if (shown()) tick() })
  // Back from a login terminal: the AWS credentials may have changed.
  window.addEventListener('focus', () => { if (S.aws) void loadAws() })

  if (hasFlint) {
    flint.onMessage((m) => {
      if (!m || typeof m !== 'object') return
      switch (m.type) {
        case 'refresh':
          S.now = Date.now()
          void loadContexts()
          void refreshOverview()
          break
        case 'settings':
          if (Number.isInteger(m.refreshSeconds) && m.refreshSeconds > 0) { S.refreshSeconds = m.refreshSeconds; startTimer() }
          break
        case 'visible': {
          const was = shown()
          S.visible = !!m.visible
          if (!was && shown()) tick()
          break
        }
        case 'aws':
          onAwsDone(m)
          break
      }
    })
  }

  async function start() {
    render()
    if (!hasFlint) return
    try {
      const [saved, settings] = await Promise.all([req('state'), req('settings')])
      S.saved = { context: saved.context || '', namespaces: saved.namespaces || {}, view: saved.view === 'resources' ? 'resources' : 'apps' }
      S.context = S.saved.context
      S.view = S.saved.view
      if (Number.isInteger(settings.refreshSeconds) && settings.refreshSeconds > 0) S.refreshSeconds = settings.refreshSeconds
    } catch (err) {
      toast(errorText(err), 'error')
    }
    startTimer()
    await loadContexts()
  }
  start()
  </script>
</body>
</html>

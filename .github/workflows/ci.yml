name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every day against Flint's main: a contract change in Flint that breaks an
  # extension shows up here, not in a user's Settings ▸ Extensions.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      flint-ref:
        description: Flint branch, tag or commit to check against
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Manifests and Go modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Manifests have the required fields
        run: |
          status=0
          for m in */flint-extension.json; do
            if ! jq -e '(.contract | type == "number") and (.id | type == "string") and (.name | type == "string") and (.version | type == "string") and (.run.command | type == "string")' "$m" > /dev/null; then
              echo "::error file=$m::needs contract, id, name, version and run.command"
              status=1
            fi
          done
          exit $status

      - name: Every extension has a README
        run: |
          status=0
          for m in */flint-extension.json; do
            dir=$(dirname "$m")
            if [ ! -s "$dir/README.md" ]; then
              echo "::error file=$m::$dir has no README.md"
              status=1
            fi
          done
          exit $status

      - name: gofmt, vet and build every Go extension
        run: |
          status=0
          for mod in */go.mod; do
            dir=$(dirname "$mod")
            echo "== $dir"
            unformatted=$(gofmt -l "$dir")
            if [ -n "$unformatted" ]; then echo "::error::not gofmt'ed: $unformatted"; status=1; fi
            (cd "$dir" && go vet ./... && go build -o /dev/null . && go test ./...) || status=1
          done
          exit $status

  contract:
    name: Extension contract (Flint's own checker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flint-ide/flint
          ref: ${{ inputs.flint-ref || 'main' }}
          path: .flint
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      # The checker is Flint's manifest and host code: the same rules and the
      # same process handling as in the app (cmd/flint-extcheck).
      - name: Build Flint's extension checker
        run: cd .flint && go build -o "$RUNNER_TEMP/flint-extcheck" ./cmd/flint-extcheck

      - name: Build each extension's program
        run: |
          for m in */flint-extension.json; do
            dir=$(dirname "$m")
            cmd=$(jq -r '.run.command // empty' "$m")
            if [ -n "$cmd" ] && [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go build -o "$cmd" .)
            fi
          done

      - name: Check every extension against the contract
        run: |
          dirs=()
          for m in */flint-extension.json; do dirs+=("$(dirname "$m")"); done
          "$RUNNER_TEMP/flint-extcheck" "${dirs[@]}"
